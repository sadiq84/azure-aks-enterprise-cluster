apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-workload-secrets
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<WORKLOAD_IDENTITY_CLIENT_ID>"
    keyvaultName: "kv-aks-secrets-prod"
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: database-connection-string
          objectType: secret
          objectVersion: ""
        - |
          objectName: api-jwt-private-key
          objectType: secret
          objectVersion: ""
    tenantId: "<AZURE_TENANT_ID>"
  secretObjects:
  - secretName: app-production-secrets
    type: Opaque
    data:
    - objectName: database-connection-string
      key: DB_CONNECTION
    - objectName: api-jwt-private-key
      key: JWT_SECRET
